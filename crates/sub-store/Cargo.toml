[package]
name = "reifydb-sub-store"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "General storage subsystem for ReifyDB."

[lib]
doctest = false

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
arrow-array = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
reifydb-catalog = { workspace = true, optional = true }
reifydb-core = { workspace = true }
reifydb-engine = { workspace = true, optional = true }
reifydb-evaluate = { workspace = true, optional = true }
reifydb-runtime = { workspace = true }
reifydb-store-column = { workspace = true, optional = true }
reifydb-sub-api = { workspace = true }
reifydb-transaction = { workspace = true, optional = true }
reifydb-value = { workspace = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true }


[features]
default = []
column = [
	"dep:arrow-array",
	"dep:arrow-schema",
	"dep:dashmap",
	"dep:reifydb-catalog",
	"dep:reifydb-engine",
	"reifydb-engine/column",
	"dep:reifydb-evaluate",
	"dep:reifydb-store-column",
	"dep:reifydb-transaction",
	"dep:thiserror",
]

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
reifydb = { workspace = true, features = ["testing", "column"] }
reifydb-test-harness = { workspace = true, features = ["column"] }
tempfile = { workspace = true }
