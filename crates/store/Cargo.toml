[package]
name = "reifydb-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Row-tier store layer: page model and residency traits"

[lib]
doctest = false

[features]
sqlite = ["rusqlite", "reifydb-sqlite"]

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
hashbrown = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-filter = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-sqlite = { workspace = true, optional = true }
reifydb-value = { workspace = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"], optional = true }
