[package]
name = "reifydb-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SDK for building ReifyDB operators, procedures, transforms and more"

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-codec = { workspace = true }
reifydb-flow = { workspace = true }
bumpalo.workspace = true
reifydb-abi.workspace = true
reifydb-core.workspace = true
reifydb-runtime.workspace = true
reifydb-testing-chaos = { workspace = true, optional = true, features = ["operator"] }
reifydb-value.workspace = true
postcard.workspace = true
rand.workspace = true
serde.workspace = true
rkyv.workspace = true
reifydb-macro = { workspace = true }
tracing.workspace = true
uuid.workspace = true

[features]
default = []
# The testing module - harness, builders, and the chaos framework - is opt-in. `reifydb-sdk` is a
# mandatory dependency of the umbrella crate, so an ungated testing module shipped the whole chaos
# harness in every production build.
test-support = ["dep:reifydb-testing-chaos"]
chaos = ["test-support"]

[dev-dependencies]
reifydb-testing-macro = { workspace = true }

[[test]]
name = "ffi"
path = "tests/ffi.rs"
required-features = ["test-support"]

[[test]]
name = "chaos"
path = "tests/chaos.rs"
required-features = ["test-support"]

[[test]]
name = "operator"
path = "tests/operator.rs"
required-features = ["test-support"]


