[package]
name = "reifydb-catalog"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Database catalog and metadata management for ReifyDB"

[lib]
doctest = false

[features]
default = []

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-store-commit = { workspace = true }
reifydb-store-multi = { workspace = true }
reifydb-store-single = { workspace = true }
reifydb-transaction = { workspace = true }
reifydb-value = { workspace = true }

crossbeam-skiplist = {workspace = true}
once_cell = {workspace = true}
reifydb-macro = { workspace = true }
tracing = { workspace = true }
serde_json.workspace = true
subtle = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
reifydb-test-harness = { workspace = true }
reifydb-engine = { workspace = true, features = ["tokio"] }
reifydb-testing = { workspace = true }
test_each_file = { workspace = true }
