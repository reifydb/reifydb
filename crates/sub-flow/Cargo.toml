[package]
name = "reifydb-sub-flow"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flow subsystem for stream processing and data flows"

[features]
default = []
chaos = []

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-cdc = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-macro = { workspace = true }
reifydb-catalog = { workspace = true }
reifydb-engine = { workspace = true }
reifydb-evaluate = { workspace = true }
reifydb-extension = { workspace = true }
reifydb-flow = { workspace = true, features = ["runtime"] }
reifydb-store-operator = { workspace = true }
reifydb-store-single = { workspace = true }
reifydb-routine-abi = { workspace = true }
reifydb-abi = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-sdk = { workspace = true }
reifydb-rql = { workspace = true }
reifydb-sub-api = { workspace = true }
reifydb-transaction = { workspace = true }
reifydb-value = { workspace = true }

serde = { workspace = true }
serde_bytes = { workspace = true }
postcard = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

rayon = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = { workspace = true }

[dev-dependencies]
reifydb-routine = { workspace = true }
reifydb-testing-sdk = { workspace = true }
reifydb-core = { workspace = true }
reifydb-value = { workspace = true }
reifydb-abi = { workspace = true }
reifydb-rql = { workspace = true }
reifydb = { workspace = true, features = ["testing"] }
reifydb-test-harness = { workspace = true, features = ["operator"] }
reifydb-testing-chaos = { workspace = true, features = ["operator"] }
reifydb-testing-flow = { workspace = true }
reifydb-testing-macro = { workspace = true }
rand = { workspace = true }
tracing-subscriber = { workspace = true }
