[package]
name = "reifydb-store-operator"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Single-version storage for flow operator state"
autotests = false

[lib]
doctest = false

[features]
default = ["sqlite"]
sqlite = ["rusqlite", "reifydb-sqlite", "reifydb-store/sqlite"]
chaos = ["sqlite"]

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-filter = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-store = { workspace = true }
reifydb-sqlite = { workspace = true, optional = true }
reifydb-value = { workspace = true }
dashmap = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"], optional = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
test_each_file = { workspace = true }
reifydb-testing = { workspace = true }
reifydb-testing-chaos = { workspace = true }
reifydb-testing-macro = { workspace = true }
rand = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite.rs"

[[test]]
name = "chaos"
path = "tests/chaos.rs"
