[package]
name = "reifydb-column"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Columnar storage engine for ReifyDB."

[lib]
doctest = false

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-core = { workspace = true }
reifydb-value = { workspace = true }
arrow-arith = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
vortex-alp = { workspace = true }
vortex-array = { workspace = true }
vortex-arrow = { workspace = true }
vortex-btrblocks = { workspace = true }
vortex-buffer = { workspace = true }
vortex-datetime-parts = { workspace = true }
vortex-decimal-byte-parts = { workspace = true }
vortex-error = { workspace = true }
vortex-fastlanes = { workspace = true }
vortex-flatbuffers = { workspace = true }
vortex-fsst = { workspace = true }
vortex-mask = { workspace = true }
vortex-onpair = { workspace = true }
vortex-runend = { workspace = true }
vortex-sequence = { workspace = true }
vortex-session = { workspace = true }
vortex-sparse = { workspace = true }
vortex-zigzag = { workspace = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
uuid = { workspace = true }
