[package]
name = "reifydb-store-cdc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Block-structured storage for the change data capture log"

[lib]
doctest = false

[features]
default = ["sqlite"]
sqlite = ["rusqlite", "reifydb-sqlite", "dep:zstd"]
chaos = ["sqlite"]

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-catalog = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-sqlite = { workspace = true, optional = true }
reifydb-value = { workspace = true }
postcard = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"], optional = true }
zstd = { workspace = true, optional = true }

[dev-dependencies]
reifydb-testing = { workspace = true }
reifydb-testing-chaos = { workspace = true }
reifydb-testing-macro = { workspace = true }
rand = { workspace = true }
test_each_file = { workspace = true }
