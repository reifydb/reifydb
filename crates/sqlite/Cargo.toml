[package]
name = "reifydb-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared SQLite configuration types used by ReifyDB storage subsystems"

[lib]
doctest = false

[features]
default = []

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-value = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(not(any(target_arch = "wasm32", fuzzing)))'.dependencies]
reifydb-workspace-hack = { workspace = true }

[dev-dependencies]
reifydb-testing = { workspace = true }
