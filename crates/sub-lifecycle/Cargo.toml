[package]
name = "reifydb-sub-lifecycle"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Data lifecycle subsystem for ReifyDB: flush, retention, reclamation, and truncation."

[lib]
doctest = false

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-catalog = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-engine = { workspace = true }
reifydb-flow = { workspace = true, features = ["runtime"] }
reifydb-runtime = { workspace = true }
reifydb-store-commit = { workspace = true }
reifydb-store-multi = { workspace = true }
reifydb-sub-api = { workspace = true }
reifydb-transaction = { workspace = true }
reifydb-value = { workspace = true }
tracing = { workspace = true }

[features]
default = ["sqlite"]
sqlite = ["reifydb-store-multi/sqlite"]

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
reifydb-test-harness = { workspace = true }
reifydb-catalog = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-testing = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", fuzzing)))'.dependencies]
reifydb-workspace-hack = { workspace = true }
