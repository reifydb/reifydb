[package]
name = "reifydb-transaction"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transaction management and concurrency control for ReifyDB"

[lib]
doctest = false

[features]
default = ["test-stress"]
test-stress = []
worker_pool = []
chaos = []

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-store-multi = { workspace = true }
reifydb-store-single = { workspace = true }
reifydb-value = { workspace = true }
reifydb-runtime = { workspace = true }
dashmap = { workspace = true }

thiserror = { workspace = true }
crossbeam-skiplist = { workspace = true }
indexmap = { workspace = true }
postcard = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
reifydb-testing = { workspace = true }
reifydb-testing-chaos = { workspace = true }
reifydb-testing-macro = { workspace = true }
test_each_file = { workspace = true }
rand = { workspace = true }
