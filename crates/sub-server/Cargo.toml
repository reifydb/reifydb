[package]
name = "reifydb-sub-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Common infrastructure for server subsystems"

[lib]
doctest = false

[features]
default = []

[dependencies]
reifydb-codec = { workspace = true }
reifydb-auth = { workspace = true }
reifydb-client = { workspace = true }
reifydb-core = { workspace = true }
reifydb-engine = { workspace = true }
reifydb-remote-proxy = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-subscription = { workspace = true }
reifydb-transaction = { workspace = true }
reifydb-value = { workspace = true }

dashmap = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
reifydb-build = { workspace = true }
