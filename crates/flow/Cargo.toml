[package]
name = "reifydb-flow"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared flow building blocks: stateless operators and view row encoding"

[lib]
doctest = false

[build-dependencies]
reifydb-build = { workspace = true }

[features]
default = []
testing = ["dep:reifydb-runtime"]
runtime = [
    "dep:reifydb-catalog",
    "dep:reifydb-evaluate",
    "dep:reifydb-routine-abi",
    "dep:reifydb-rql",
    "dep:reifydb-runtime",
    "dep:reifydb-transaction",
    "dep:serde",
]

[dependencies]
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
reifydb-catalog = { workspace = true, optional = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-evaluate = { workspace = true, optional = true }
reifydb-routine-abi = { workspace = true, optional = true }
reifydb-rql = { workspace = true, optional = true }
reifydb-runtime = { workspace = true, optional = true }
reifydb-transaction = { workspace = true, optional = true }
reifydb-value = { workspace = true }

serde = { workspace = true, optional = true }

tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
reifydb-runtime = { workspace = true }
reifydb-test-harness = { workspace = true, features = ["operator"] }

[[test]]
name = "filter"
path = "tests/filter.rs"
required-features = ["runtime"]

[[test]]
name = "map"
path = "tests/map.rs"
required-features = ["runtime"]
