[package]
name = "reifydb-sub-subscription"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Ephemeral subscription subsystem for ReifyDB"

[lib]
doctest = false

[features]
default = []

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-cdc = { workspace = true }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-catalog = { workspace = true }
reifydb-engine = { workspace = true }
reifydb-flow = { workspace = true, features = ["runtime"] }
reifydb-flow-async = { workspace = true, features = ["runtime"] }
reifydb-macro = { workspace = true }
reifydb-runtime = { workspace = true }
reifydb-store-cdc = { workspace = true }
reifydb-sub-api = { workspace = true }
reifydb-subscription = { workspace = true }
reifydb-transaction = { workspace = true }
reifydb-value = { workspace = true }

arrow-array = { workspace = true }
arrow-schema = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
reifydb-core = { workspace = true, features = ["testing"] }
reifydb-engine = { workspace = true, features = ["testing"] }
reifydb-flow = { workspace = true, features = ["runtime", "testing"] }
rand = { workspace = true }
reifydb = { workspace = true, features = ["sub_flow", "testing"] }
reifydb-test-harness = { workspace = true, features = ["operator"] }
