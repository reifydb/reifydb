[package]
name = "reifydb-test-harness"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Test factories, builders, and assertions for the ReifyDB workspace"

[build-dependencies]
reifydb-build = { workspace = true }

[dependencies]
reifydb-value = { workspace = true }
reifydb-catalog = { workspace = true, optional = true }
reifydb-core = { workspace = true, optional = true }
reifydb-transaction = { workspace = true, optional = true }
reifydb-runtime = { workspace = true, optional = true }
reifydb-engine = { workspace = true, optional = true }
reifydb-auth = { workspace = true, optional = true }
reifydb-sqlite = { workspace = true, optional = true }
reifydb-codec = { workspace = true, optional = true }
reifydb-sdk = { workspace = true, optional = true }
reifydb-testing-sdk = { workspace = true, optional = true }
reifydb-flow = { workspace = true, optional = true, features = ["runtime"] }
reifydb-cdc = { workspace = true, optional = true }
reifydb-extension = { workspace = true, optional = true }
reifydb-routine = { workspace = true, optional = true }
reifydb-routine-abi = { workspace = true, optional = true }
reifydb-store-multi = { workspace = true, optional = true }
reifydb-store-operator = { workspace = true, optional = true }
reifydb-store-single = { workspace = true, optional = true }

[features]
default = ["engine", "auth"]
engine = [
    "dep:reifydb-engine",
    "dep:reifydb-catalog",
    "dep:reifydb-cdc",
    "dep:reifydb-core",
    "dep:reifydb-extension",
    "dep:reifydb-routine",
    "dep:reifydb-routine-abi",
    "dep:reifydb-runtime",
    "dep:reifydb-sqlite",
    "dep:reifydb-store-multi",
    "dep:reifydb-store-operator",
    "dep:reifydb-store-single",
    "dep:reifydb-transaction",
]
auth = ["engine", "dep:reifydb-auth", "dep:reifydb-runtime"]
operator = [
    "engine",
    "dep:reifydb-runtime",
    "dep:reifydb-codec",
    "dep:reifydb-testing-sdk",
    "dep:reifydb-flow",
]

[dev-dependencies]
reifydb = { workspace = true, features = ["testing"] }
