bench = false
doctest = false

[dependencies]
reifydb-node = { version = "0.9.0", path = "../../../rust/reifydb-node" }
reifydb-place-backend = { path = "../backend" }
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
reifydb-build = { workspace = true }
