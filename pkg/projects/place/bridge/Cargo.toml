[package]
name = "reifydb-place-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Node native addon exposing place's real engine for web tests"
publish = false

[lib]
name = "place_bridge"
crate-type = ["cdylib"]
