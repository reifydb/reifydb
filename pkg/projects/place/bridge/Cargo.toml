[package]
name = "reifydb-place-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Node native addon exposing place's real engine for web tests"
publish = false

[lib]
name = "place_bridge"
crate-type = ["cdylib"]
test = false
bench = false
doctest = false

[dependencies]
reifydb-node = { workspace = true }
reifydb = { workspace = true, features = ["sub_flow"] }
reifydb-place-backend = { path = "../backend" }
napi = { workspace = true }
napi-derive = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
reifydb-build = { workspace = true }
