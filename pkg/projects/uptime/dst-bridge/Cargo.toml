[package]
name = "reifydb-uptime-dst-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "POC: Node native addon exposing uptime's real DST-mode engine for webapp tests"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reifydb = { workspace = true, features = ["testing"] }
reifydb-uptime = { version = "0.9.0", path = ".." }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
reifydb-build = { workspace = true }
