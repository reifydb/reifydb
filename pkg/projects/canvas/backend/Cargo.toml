[package]
name = "reifydb-canvas-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared pixel canvas built on ReifyDB"
publish = false

[lib]
name = "reifydb_canvas"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "reifydb-canvas"
path = "src/main.rs"

[dependencies]
reifydb = { workspace = true, features = ["server", "sub_flow"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
miniz_oxide = "=0.9.1"

[dev-dependencies]
crc32fast = "=1.5.2"
flate2 = "=1.1.10"

[build-dependencies]
reifydb-build = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", fuzzing)))'.dependencies]
reifydb-workspace-hack = { workspace = true }
