[package]
name = "reifydb-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared napi bindings exposing a real ReifyDB Database, for Node test bridges and @reifydb/reifydb"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
reifydb = { workspace = true, features = ["sub_flow"] }
reifydb-codec = { workspace = true }
reifydb-sub-server = { workspace = true }
reifydb-value = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
reifydb-build = { workspace = true }
