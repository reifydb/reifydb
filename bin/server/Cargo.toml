[package]
name = "server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "reifydb-server"
path = "src/main.rs"

[dependencies]
reifydb = { workspace = true, features = ["alloc-jemalloc", "server", "sub_flow"] }

[build-dependencies]
reifydb-build = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", fuzzing)))'.dependencies]
reifydb-workspace-hack = { workspace = true }
