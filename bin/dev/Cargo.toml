[package]
name = "dev"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "reifydb-dev"
path = "src/main.rs"

[dependencies]
reifydb = { workspace = true, features = ["alloc-jemalloc"] }
reifydb-codec = { workspace = true }
reifydb-core = { workspace = true }
reifydb-runtime = { workspace = true }
clap = { version = "=4.6.7", features = ["derive", "env"] }
postcard = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
reifydb-value = { workspace = true }

[build-dependencies]
reifydb-build = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", fuzzing)))'.dependencies]
reifydb-workspace-hack = { workspace = true }
