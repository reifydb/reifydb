[package]
name = "playground"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
pco = ["reifydb/column-pco"]

[[bin]]
name = "playground"
path = "src/main.rs"

[[bin]]
name = "ohlcv_bench"
path = "src/ohlcv/main.rs"

[dependencies]
reifydb = { workspace = true, features = ["alloc-jemalloc", "column"] }

[build-dependencies]
reifydb-build = { workspace = true }
